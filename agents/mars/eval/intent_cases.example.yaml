    active_policies: []
    fleet: {robots_total: 6, robots_available: 5, chargers_total: 2,
            chargers_available: 1, valid_zones: [aisle_5, dock, cold_zone]}
    last_applied: {}
  ground_truth:
    expected_action: translate
    expected_policies:
      - {type: delay_low_priority_missions, params: {}, duration_sec: 1800}
      - {type: avoid_zone, params: {zone: aisle_5}, duration_sec: 1800}
    expected_guardrail: [PASS, PASS]
    reject_category: null
    must_not_activate: false
    notes: "한 문장 → 정책 2개 (set 일치로 채점)."

