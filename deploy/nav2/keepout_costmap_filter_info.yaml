# Nav2 Costmap Filter Info server — keepout filter (ROS2 Jazzy)
#
# Publishes nav2_msgs/CostmapFilterInfo telling each robot's KeepoutFilter
# where to find the mask and how to interpret it.  The mask itself
# (nav_msgs/OccupancyGrid on mask_topic) is published DYNAMICALLY by the MARS
# supervisor — mars/ros/isaac_sim_adapter.py ROS2SimAdapter.publish_keepout_mask
# — whenever the agents activate/deactivate an avoid_zone policy.  So we do NOT
# run a static map_server for the mask here; the supervisor is the mask source.
#
# type: 0 = keepout/preferred-lanes filter.
# base/multiplier map mask value v -> cost: cost = base + multiplier * v.
#   With base=0, multiplier=1, mask value 100 -> cost 100 (lethal) = no-go.
costmap_filter_info_server:
  ros__parameters:
    use_sim_time: true
    type: 0
    filter_info_topic: "/costmap_filter_info"
    mask_topic: "/keepout_filter_mask"
    base: 0.0
    multiplier: 1.0
